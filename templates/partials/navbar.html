                    <a

                        class="rounded-xl px-4 py-2 text-sm font-semibold text-slate-600 transition hover:bg-slate-100 hover:text-slate-900"
                    >
                        Mi perfil
                    </a>


                    <!-- Salir -->
                    <a
                        href="{% url 'accounts:logout' %}"
                        class="rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white transition hover:bg-slate-700"
                    >

                    </a>

                {% else %}

                    <!-- Ingresar -->
                    <a

                    <a

            <!-- Botón menú móvil -->
            <button

                type="button"

                aria-label="Abrir menú"
                aria-expanded="false"
            >

                <svg
                    id="menu-open-icon"
                    class="h-6 w-6"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M4 6h16M4 12h16M4 18h16"
                    />
                </svg>

                <svg
                    id="menu-close-icon"
                    class="hidden h-6 w-6"
                    fill="none"
                    stroke="currentColor"

                        d="M6 18L18 6M6 6l12 12"

        <!-- Menú móvil -->
        <div
            id="mobile-menu"
            class="hidden border-t border-slate-200 py-4 md:hidden"
        >

            <div class="flex flex-col gap-2">

                <!-- Catálogo -->
                <a
                    href="{% url 'catalog:catalog' %}"
                    class="rounded-xl px-4 py-3 text-sm font-semibold text-slate-700 transition hover:bg-slate-100"
                >

                {% if user.is_authenticated %}

                    <a

                    <!-- Mi perfil -->

<script>
    const mobileMenuButton =
        document.getElementById("mobile-menu-button");

    const mobileMenu =
        document.getElementById("mobile-menu");

    const menuOpenIcon =
        document.getElementById("menu-open-icon");

    const menuCloseIcon =
        document.getElementById("menu-close-icon");


    mobileMenuButton.addEventListener("click", function () {

        const isOpen =
            !mobileMenu.classList.contains("hidden");

        mobileMenu.classList.toggle("hidden");

        menuOpenIcon.classList.toggle("hidden");

        menuCloseIcon.classList.toggle("hidden");

        mobileMenuButton.setAttribute(
            "aria-expanded",
            String(!isOpen)
        );

    });
</script>
